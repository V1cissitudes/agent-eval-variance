[project]
name = "agentrig"
version = "0.1.0"
description = "A small hand-written LLM agent and repeated-trial evaluation harness for studying variance in agent evaluations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Su Tanjia" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "datasets>=3.0",
    "rank_bm25>=0.2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Only installed on the RTX 5070 (WSL2): `uv sync --extra vllm`
vllm = ["vllm>=0.10; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrig"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
