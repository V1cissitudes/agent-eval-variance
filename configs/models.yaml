# What to run. The same logical model has a different name on each platform.
# enable_thinking: default for Qwen3 thinking mode; experiment configs may override it.
models:
  qwen3-4b:
    hf_id: Qwen/Qwen3-4B          # original hybrid model (thinking on/off with the same weights)
    enable_thinking: false
    served_names:
      ollama_mac: qwen3:4b-q4_K_M # NOT `qwen3:4b`, which is Qwen3-4B-Thinking-2507
      vllm_5070: Qwen/Qwen3-4B
    precision:
      ollama_mac: q4_K_M
      vllm_5070: bf16

  qwen3-4b-fp8:
    hf_id: Qwen/Qwen3-4B-FP8
    revision: 96b30dc13593a244a5e59e84687309f53c375cfa
    enable_thinking: false
    served_names:
      vllm_5070: Qwen/Qwen3-4B-FP8
    precision:
      vllm_5070: fp8_w8a8_block128
    # Validated with BF16 residual layers/KV and CUTLASS; serve_vllm.sh disables DeepGEMM.

  qwen3-4b-awq:
    hf_id: Qwen/Qwen3-4B-AWQ
    revision: 74d4bd2bd4bff9cafc9345221320bffb08b406a3
    enable_thinking: false
    served_names:
      vllm_5070: Qwen/Qwen3-4B-AWQ
    precision:
      vllm_5070: int4_awq_w4a16_g128
    # AutoAWQ Marlin kernel; served with --dtype bfloat16 (validated 2026-10-03 evening).
