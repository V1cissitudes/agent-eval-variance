# E00 pilot (see docs/experiments/E00R_rehearsal.md): 40 questions x 10 runs
# (5 seeds x 2 same-seed replicates), prefix cache on/off x temperature 0/0.7.
# Formal runs use vllm_5070; switch platforms by changing `endpoint` only.
# Design revised 2026-10-03. Sampling params top_p/top_k below remain PROVISIONAL.
name: E00_pilot
endpoint: vllm_5070
model: qwen3-4b
enable_thinking: false
eval_set: data/frozen/hotpotqa_distractor_val_300.jsonl
question_ids: []                  # empty -> first n_questions in frozen (hash) order
n_questions: 40                   # rehearsal: variance is concentrated in a few questions -> more questions
n_repeats: 10
replicates_per_seed: 2            # 5 seeds x 2 replicates: same-seed spread = serving nondeterminism
temperatures: [0.0, 0.7]
prefix_cache: [true, false]       # server-side flag; see scripts/serve_vllm.sh
max_steps: 8
top_p: 0.8                        # Qwen3 recommended non-thinking sampling (T=0.7, top_p=0.8, top_k=20);
top_k: 20                         # sent explicitly so server-side generation_config defaults cannot hide in
max_tokens_per_step: 1024
search_top_k: 2
seed: 20261001
